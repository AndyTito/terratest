server {
    # Cloud Run usa el puerto 8080 por defecto
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para máxima velocidad de entrega
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        # Para aplicaciones Single Page Application (SPA), redirigir rutas al index.html
        try_files $uri $uri/ /index.html;
    }

    # Caché optimizada para recursos estáticos versionados
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
