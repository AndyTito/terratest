name: Compilar y Publicar Imágenes en GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permite ejecutar el workflow manualmente con un clic en GitHub

# Permisos necesarios para escribir paquetes en GitHub Packages (ghcr.io)
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # 1. Compilar y Publicar Contenedor del Backend
  # ============================================================================
  backend:
    name: Publicar Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de repositorio a minúsculas
        id: repo_name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}-backend" >> $GITHUB_ENV

      - name: Compilar y Subir Imagen Docker (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./back
          file: ./back/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ============================================================================
  # 2. Compilar y Publicar Contenedor del Frontend
  # ============================================================================
  frontend:
    name: Publicar Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de repositorio a minúsculas
        id: repo_name
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}-frontend" >> $GITHUB_ENV

      - name: Compilar y Subir Imagen Docker (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: ./front
          file: ./front/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
